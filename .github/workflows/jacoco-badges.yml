---
name: Generate JaCoCo Coverage Badges

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  test:
    name: Generate and Commit Badges
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Evaluate coverage
        run: mvn -B verify

      - name: Create filtered JaCoCo CSV that contains only GT4500 results
        run: >
          > jacoco-gt4500.csv awk
          'NR==1{print;next}/GT4500/{print}'
          target/site/jacoco/jacoco.csv

      - name: Generate JaCoCo badges
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: jacoco-gt4500.csv
          generate-coverage-badge: true
          generate-branches-badge: true
          coverage-badge-filename: coverage-gt4500-instructions.svg
          branches-badge-filename: coverage-gt4500-branches.svg
          coverage-label: GT4500 instruction coverage
          branches-label: GT4500 branch coverage
          workflow-summary-heading: JaCoCo Test Coverage Summary (GT4500)

      - name: Commit badges
        uses: EndBug/add-and-commit@v9
        with:
          add: .github/badges/
          message: Add autogenerated JaCoCo badges
          default_author: github_actions
